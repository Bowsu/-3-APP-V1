<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統測農業概論第3章作物生產(90-115學年)</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-6 px-4">

    <!-- App 標頭 -->
    <header class="w-full max-w-3xl text-center mb-6">
        <h1 class="text-2xl md:text-3xl font-bold text-emerald-700 tracking-wide">
            <strong>統測農業概論第3章作物生產(90-115學年)</strong>
        </h1>
        <p class="text-sm text-slate-500 mt-1">專業線上測驗系統</p>
    </header>

    <!-- 主容器 -->
    <main class="w-full max-w-3xl bg-white shadow-lg rounded-2xl p-6 md:p-8">

        <!-- 1. 設定畫面 (Setup Screen) -->
        <div id="setup-screen" class="space-y-6">
            <h2 class="text-xl font-semibold text-slate-700 border-b pb-2">測驗參數設定</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-medium text-slate-700 mb-2">選擇測驗題數：</label>
                    <select id="question-count" class="w-full border border-slate-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="20">20 題</option>
                        <option value="40">40 題</option>
                        <option value="50">50 題</option>
                        <option value="all">全部測驗 (共 105 題)</option>
                    </select>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-2">選題模式：</label>
                    <div class="flex gap-6">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="select-mode" value="random" checked class="text-emerald-600 focus:ring-emerald-500 h-4 w-4">
                            <span class="ml-2">隨機選題</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="select-mode" value="sequential" class="text-emerald-600 focus:ring-emerald-500 h-4 w-4">
                            <span class="ml-2">依題號順序選題</span>
                        </label>
                    </div>
                </div>
            </div>

            <button onclick="startQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                開始測驗
            </button>
        </div>

        <!-- 2. 測驗進行畫面 (Quiz Screen) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-indicator" class="text-sm font-medium text-slate-500">題目 1 / 20</span>
                <span id="score-indicator" class="text-sm font-semibold text-emerald-600">目前得分：0 分</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態插入題目 -->
            </div>

            <div id="feedback-container" class="hidden p-4 rounded-lg bg-slate-100 space-y-2">
                <div id="feedback-text" class="font-bold text-lg"></div>
                <div id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></div>
            </div>

            <div class="flex justify-between pt-4 border-t">
                <button id="toggle-explanation-btn" onclick="toggleExplanation()" class="hidden bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm transition">
                    查看解析
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="ml-auto bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-medium transition shadow">
                    下一題
                </button>
            </div>
        </div>

        <!-- 3. 結果與錯題大鍋菜畫面 (Result Screen) -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="text-center space-y-2 border-b pb-6">
                <h2 class="text-2xl font-bold text-slate-700">測驗結束</h2>
                <p class="text-lg">您的獲得總分：</p>
                <div id="final-score" class="text-5xl font-extrabold text-emerald-600">100 / 100 分</div>
            </div>

            <div class="space-y-4">
                <h3 class="text-xl font-bold text-slate-700">答錯題目的彙整 (錯題大鍋菜)</h3>
                <div id="wrong-answers-container" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <!-- 動態插入錯題 -->
                </div>
            </div>

            <button onclick="resetQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition shadow">
                重新設定並再次測驗
            </button>
        </div>

    </main>

    <!-- JavaScript 邏輯與內嵌題庫 -->

        let currentQuizData = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];
        let answeredCurrent = false;

        function startQuiz() {
            const countOption = document.getElementById('question-count').value;
            const modeOption = document.querySelector('input[name="select-mode"]:checked').value;

            // 複製一份題庫
            let pool = [...fullQuestionBank];

            // 依選項篩選題數
            let targetCount = countOption === 'all' ? pool.length : parseInt(countOption);

            // 處理選題模式
            if (modeOption === 'random') {
                pool.sort(() => Math.random() - 0.5);
            }

            currentQuizData = pool.slice(0, targetCount);
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            // 切換畫面
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrent = false;
            const q = currentQuizData[currentIndex];
            
            // 更新進度與分數
            document.getElementById('progress-indicator').innerText = `題目 ${currentIndex + 1} / ${currentQuizData.length}`;
            document.getElementById('score-indicator').innerText = `目前得分：${score} 分`;

            // 隱藏回饋與按鈕
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('toggle-explanation-btn').classList.add('hidden');
            document.getElementById('next-btn').innerText = (currentIndex === currentQuizData.length - 1) ? "看測驗結果" : "下一題";

            // 組合題目與選項 HTML
            let html = `<h3 class="text-lg font-semibold text-slate-800">${currentIndex + 1}. ${q.question}</h3>`;
            html += `<div class="space-y-3 mt-4">`;
            for (let key in q.options) {
                html += `
                    <label class="option-label flex items-start p-3 border rounded-lg cursor-pointer hover:bg-emerald-50 transition border-slate-200">
                        <input type="radio" name="quiz-option" value="${key}" class="mt-1 mr-3 text-emerald-600 focus:ring-emerald-500 h-4 w-4">
                        <span class="text-slate-700">(${key}) ${q.options[key]}</span>
                    </label>
                `;
            }
            html += `</div>`;

            document.getElementById('question-container').innerHTML = html;

            // 綁定選項點擊即時判定
            const radios = document.querySelectorAll('input[name="quiz-option"]');
            radios.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (answeredCurrent) return;
                    answeredCurrent = true;
                    checkAnswer(this.value);
                });
            });
        }

        function checkAnswer(selectedOpt) {
            const q = currentQuizData[currentIndex];
            const isCorrect = (selectedOpt === q.correct);
            
            // 計算每題配分（總分100分平均分配）
            const pointsPerQuestion = 100 / currentQuizData.length;
            if (isCorrect) {
                score += pointsPerQuestion;
            }

            // 紀錄使用者作答
            userAnswers.push({
                question: q.question,
                options: q.options,
                userSelect: selectedOpt,
                correct: q.correct,
                explanation: q.explanation,
                isCorrect: isCorrect
            });

            // 更新即時得分顯示
            document.getElementById('score-indicator').innerText = `目前得分：${Math.round(score)} 分`;

            // 顯示即時回饋
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackText = document.getElementById('feedback-text');
            const explanationText = document.getElementById('explanation-text');

            feedbackContainer.classList.remove('hidden');
            document.getElementById('toggle-explanation-btn').classList.remove('hidden');

            if (isCorrect) {
                feedbackText.innerHTML = `<span class="text-emerald-600">✔ 答對了！</span>`;
                feedbackContainer.className = "p-4 rounded-lg bg-emerald-50 border border-emerald-200 space-y-2";
            } else {
                feedbackText.innerHTML = `<span class="text-rose-600">✖ 答錯了！正確答案是 (${q.correct})</span>`;
                feedbackContainer.className = "p-4 rounded-lg bg-rose-50 border border-rose-200 space-y-2";
            }

            explanationText.innerHTML = `<strong>解析：</strong>${q.explanation}`;

            // 停用所有選項避免重複作答
            const radios = document.querySelectorAll('input[name="quiz-option"]');
            radios.forEach(r => r.disabled = true);
        }

        function toggleExplanation() {
            const expDiv = document.getElementById('explanation-text');
            expDiv.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (!answeredCurrent) {
                alert("請先選擇一個答案！");
                return;
            }

            currentIndex++;
            if (currentIndex < currentQuizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const finalScoreRounded = Math.round(score);
            document.getElementById('final-score').innerText = `${finalScoreRounded} / 100 分`;

            // 篩選出錯題
            const wrongList = userAnswers.filter(ans => !ans.isCorrect);
            const container = document.getElementById('wrong-answers-container');

            if (wrongList.length === 0) {
                container.innerHTML = `
                    <div class="p-6 text-center bg-emerald-50 rounded-xl border border-emerald-200 text-emerald-700 font-semibold">
                        太棒了！全部答對，沒有錯題！
                    </div>
                `;
            } else {
                let html = '';
                wrongList.forEach((item, idx) => {
                    html += `
                        <div class="p-4 border border-rose-200 rounded-xl bg-rose-50/50 space-y-2">
                            <div class="font-bold text-slate-800">錯題 ${idx + 1}：${item.question}</div>
                            <div class="text-sm space-y-1">
                                <div class="text-rose-600 font-medium">您的作答：(${item.userSelect}) ${item.options[item.userSelect] || ''}</div>
                                <div class="text-emerald-700 font-medium">正確答案：(${item.correct}) ${item.options[item.correct]}</div>
                                <div class="text-slate-600 pt-1 border-t border-rose-100"><strong>詳盡解析：</strong>${item.explanation}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
